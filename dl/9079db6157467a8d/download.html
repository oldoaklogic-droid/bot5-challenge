<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Download AI Operator Kit</title>
<link rel="stylesheet" href="/css/styles.css">
</head><body>
<header class="site-header"><div class="container inner">
<a class="logo" href="/">Bot&nbsp;5 <span>Challenge</span></a>
</div></header>
<main><section class="hero"><div class="container">
<div class="badge">Preparing download…</div>
<h1>AI Operator Kit</h1>
<p class="hero-lead" id="status">Assembling Markdown kit…</p>
<p><a class="btn btn-primary" id="dl" href="#" download="AI-Operator-Kit.md" style="display:none">Download AI-Operator-Kit.md</a></p>
<p class="premise"><a href="/thanks/">Back to thank-you page</a></p>
</div></section></main>
<script>
(async () => {
  const n = 5;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = await fetch('./parts/' + String(i).padStart(2,'0') + '.txt');
    if (!r.ok) throw new Error('part ' + i + ' failed');
    parts.push(await r.text());
  }
  const text = parts.join('');
  const blob = new Blob([text], {type: 'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.getElementById('dl');
  a.href = url;
  a.style.display = 'inline-block';
  document.getElementById('status').textContent = 'Ready — ' + text.length + ' characters. Click to save AI-Operator-Kit.md';
  a.click();
})().catch(e => { document.getElementById('status').textContent = 'Download failed: ' + e.message; });
</script>
</body></html>
